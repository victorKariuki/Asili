[package]
name = "asili-evaluator"
version = "0.2.0"
edition = "2021"

[dependencies]
asili-diagnostics = { path = "../diagnostics" }
rand = "0.8"
asili-parser = { path = "../parser" }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1.11"
stacker = "0.1.24"
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand` (via getrandom 0.2) needs this explicitly enabled to build for wasm32-unknown-unknown
# (browser) — it calls into `crypto.getRandomValues` via wasm-bindgen's JS glue. A no-op for
# wasm32-wasip1/wasi targets, which already have native WASI random support.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
asili-lexer = { path = "../lexer" }

[features]
# Browser wasm32 target: route I/O builtins (chapisha, onyo, makosa) to `console.log`/`console.error`
# via wasm-bindgen instead of the default silent no-op. Mutually meaningful only on wasm32; a
# no-op on other targets since the platform module gates on target_arch too.
wasm-browser = ["dep:wasm-bindgen"]
# WASI wasm32 target (wasm32-wasip1/wasm32-wasi): std's io/fs already work correctly under WASI,
# so this feature just stops special-casing wasm32 — no extra crate dependency needed.
wasm-wasi = []

[lib]
path = "src/lib.rs"
