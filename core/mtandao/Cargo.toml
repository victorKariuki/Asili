[package]
name = "asili-mtandao"
version = "0.1.0"
edition = "2021"
description = "Asili's network layer: TCP, TLS and Unix streams and listeners, DNS, on tokio."

# One connection layer for every network builtin (sockets, the HTTP client and server): streams
# are tokio's, so a `sawia` task waiting on one lets the thread's other tasks run.
[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros", "fs"] }
# One crypto provider for the whole program (aws-lc-rs), as the HTTP client already uses.
rustls = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
socket2 = { version = "0.6", features = ["all"] }
# HTTP/1.1 and HTTP/2 (server; the client follows), with upgrades for WebSocket.
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
# WebSocket (RFC 6455), on the same streams as everything else.
tokio-tungstenite = "0.30"
http-body-util = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
percent-encoding = "2"
form_urlencoded = "1"
# Response compression (gzip, brotli).
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# The client: proxies (SOCKS), URLs, the cookie jar, Basic and Digest authentication.
tokio-socks = "0.5"
url = "2"
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order"] }
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
hyper-util = { version = "0.1", features = ["client", "http2", "tokio"] }
rcgen = "0.13"
