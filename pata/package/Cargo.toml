[package]
name = "pata-package"
version = "0.2.2"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
semver = "1.0"
serde_json = "1"
sha2 = "0.11"
chrono = "0.4"
git2 = "0.19"
thiserror = "1"
ureq = { version = "2", default-features = false, features = ["gzip", "native-tls"] }
native-tls = "0.2"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3.8"
tiny_http = "0.12"
