[package]
name = "pata-fmt"
version = "0.3.0"
edition = "2021"

[lib]
name = "pata_fmt"
path = "src/lib.rs"

[[bin]]
name = "pata-fmt"
path = "src/main.rs"

[dependencies]
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.8"
