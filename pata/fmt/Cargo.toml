[package]
name = "pata-fmt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pata-fmt"
path = "src/main.rs"

[dependencies]
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
