[package]
name = "pata-lint"
version = "0.2.0"
edition = "2021"

[lib]
name = "pata_lint"
path = "src/lib.rs"

[[bin]]
name = "pata-lint"
path = "src/main.rs"

[dependencies]
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
asili-diagnostics = { path = "../../core/diagnostics" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
