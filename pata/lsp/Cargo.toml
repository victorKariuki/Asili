[package]
name = "pata-lsp"
version = "0.4.0"
edition = "2021"

[dependencies]
asili-diagnostics = { path = "../../core/diagnostics" }
asili-evaluator = { path = "../../core/evaluator" }
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
pata-lint = { path = "../lint" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[[bin]]
name = "pata-lsp"
path = "src/main.rs"
