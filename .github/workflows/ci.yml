name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Runtime never panics (clippy deny lints in the evaluator's runtime modules)
        run: cargo clippy -p asili-evaluator --lib

      - name: Optimizer differential fuzzing (optimized vs unoptimized native code, 2,000 programs)
        run: ASILI_FUZZ_PROGRAMS=2000 cargo test --release -p asili-evaluator --test fuzz

  native-platforms:
    # nguvu on every platform it targets, on real hardware: AArch64 Linux, Apple silicon macOS
    # (MAP_JIT mapping) and x86-64 Windows (Microsoft x64 calling convention). The differential
    # tests compare native code against hand-checked reference results (`tests/golden/`).
    name: Native code on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p asili-evaluator
        run: cargo test -p asili-evaluator

  cortex-m:
    # Strict code built for Cortex-M (Thumb-2, fpv5-d16) and run under qemu: every result must
    # equal native code's on the build machine, bit for bit (`tests/kifaa.rs`).
    name: Strict code on Cortex-M (qemu)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install clang, lld, llvm-mc and qemu
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-user-static

      - name: Thumb-2 encodings against llvm-mc
        run: cargo test -p asili-evaluator --lib t32

      - name: Device agreement (examples, hand-written cases, 400 random strict programs)
        run: ASILI_KIFAA_REQUIRE=1 ASILI_KIFAA_PROGRAMS=400 cargo test --release -p asili-evaluator --test kifaa

  wasm:
    # The browser build compiles programs to a wasm module it instantiates beside itself (the
    # playground's native code); every example must print exactly what native code prints.
    name: Native code as wasm (playground)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Examples agree with native code
        run: driver/wasm/tests/agree.sh

  examples:
    name: Lint, build, and test examples
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build pata-cli and pata-lint
        run: cargo build -p pata-cli -p pata-lint

      - name: Lint every example
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            echo "::group::pata-lint $name"
            if ! ./target/debug/pata-lint --makosa-tu "$dir"; then
              echo "lint failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Build every example (pata jenga)
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ ! -f "$dir/pata.toml" ]; then
              continue
            fi
            echo "::group::pata jenga $name"
            if ! (cd "$dir" && "$OLDPWD/target/debug/pata-cli" jenga); then
              echo "jenga failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run tests for every example (pata jaribu)
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ ! -f "$dir/pata.toml" ]; then
              continue
            fi
            echo "::group::pata jaribu $name"
            if ! (cd "$dir" && "$OLDPWD/target/debug/pata-cli" jaribu); then
              echo "jaribu failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
