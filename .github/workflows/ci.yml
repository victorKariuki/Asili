name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

  native-platforms:
    # nguvu on every platform it targets, on real hardware: AArch64 Linux, Apple silicon macOS
    # (MAP_JIT mapping) and x86-64 Windows (Microsoft x64 calling convention). The engine
    # differential tests compare native code against the interpreter and the tree-walker.
    name: Native code on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p asili-evaluator
        run: cargo test -p asili-evaluator

  examples:
    name: Lint, build, and test examples
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build pata-cli and pata-lint
        run: cargo build -p pata-cli -p pata-lint

      - name: Lint every example
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            echo "::group::pata-lint $name"
            if ! ./target/debug/pata-lint --makosa-tu "$dir"; then
              echo "lint failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Build every example (pata jenga)
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ ! -f "$dir/pata.toml" ]; then
              continue
            fi
            echo "::group::pata jenga $name"
            if ! (cd "$dir" && "$OLDPWD/target/debug/pata-cli" jenga); then
              echo "jenga failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run tests for every example (pata jaribu)
        run: |
          set -e
          status=0
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ ! -f "$dir/pata.toml" ]; then
              continue
            fi
            echo "::group::pata jaribu $name"
            if ! (cd "$dir" && "$OLDPWD/target/debug/pata-cli" jaribu); then
              echo "jaribu failed: $name"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
