name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build rustdoc + TypeDoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --workspace
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Assemble docs-site/
        run: |
          set -e
          mkdir -p docs-site
          cp docs-site-src/index.html docs-site/index.html
          cp -r target/doc docs-site/rustdoc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extension deps
        working-directory: extensions/vscode
        run: npm install

      - name: Install docs-tooling deps (isolated TypeDoc + TypeScript)
        working-directory: extensions/vscode/docs-tooling
        run: npm install

      - name: Generate TypeDoc
        working-directory: extensions/vscode/docs-tooling
        run: npm run typedoc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
